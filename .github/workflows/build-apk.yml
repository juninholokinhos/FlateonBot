name: Gerar APK Flateon

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair projeto
        run: |
          mkdir -p projeto
          unzip -o *.zip -d projeto

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
                - name: Configurar AndroidX
        run: |
          echo "android.useAndroidX=true" > projeto/gradle.properties
          echo "android.enableJetifier=true" >> projeto/gradle.properties

      - name: Compilar APK
        run: |
          cd projeto
          gradle assembleDebug

      - name: Procurar APK
        run: |
          find projeto -type f -name "*.apk"

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: FlateonBot-APK
          path: projeto/app/build/outputs/apk/debug/app-debug.apk
