name: Gerar APK Flateon

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair projeto
        run: |
          mkdir -p projeto
          unzip -o *.zip -d projeto

      - name: Mostrar estrutura do projeto
        run: |
          echo "===== ARQUIVOS ENCONTRADOS ====="
          find projeto -maxdepth 5 -type f | sort
          echo "===== PROCURANDO GRADLE ====="
          find projeto -name "gradlew" -o -name "settings.gradle" -o -name "settings.gradle.kts" -o -name "build.gradle" -o -name "build.gradle.kts"

      - name: Procurar projeto Android
        run: |
          if find projeto -name "gradlew" -type f | grep -q .; then
            echo "Gradle Wrapper encontrado."
          else
            echo "ERRO: Gradle Wrapper não encontrado."
            exit 1
          fi
